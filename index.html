<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الدافعية للتعلم</title><style>.ft{text-align:center;margin:28px auto 10px;padding-top:14px;border-top:2px dashed var(--bd);font-size:20px;line-height:1.9;max-width:900px}
:root{--bg:#fdf6e9;--cd:#fff;--tx:#2b2b3a;--ac:#c62f4a;--ok:#2e9d5b;--no:#d9534f;--bd:#e8d9bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1b24;--cd:#2a2735;--tx:#f1eee8;--bd:#443f55}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;padding:14px;font-size:20px}#app{max-width:900px;margin:auto}
h2{text-align:center;margin:6px;font-size:34px}.tp{text-align:center;color:var(--ac);margin:0;font-size:24px}.tn{background:var(--ac);color:#fff;border-radius:12px;padding:6px 16px;font-size:20px}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;cursor:pointer;margin:4px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.msg{text-align:center;font-size:22px;margin:10px;min-height:30px}
.q{max-width:760px;margin:auto}.o{display:block;width:100%;margin:10px 0;padding:16px;border-radius:14px;border:3px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-size:24px;cursor:pointer}.o.ok{background:var(--ok);color:#fff}.o.no{background:var(--no);color:#fff}
.tm{height:14px;background:var(--ac);border-radius:7px;width:100%;transition:width linear;margin:8px 0}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt>div{display:grid;gap:8px}.mx{padding:12px;font-size:20px;border-radius:12px;border:3px solid var(--bd);background:var(--cd);cursor:pointer;display:flex;align-items:center;min-height:80px}.s{border-color:var(--ac)!important}.dn{border-color:var(--ok)!important;opacity:.5;pointer-events:none}
.qq{font-size:28px;text-align:center;margin:10px}.ans{font-size:26px;text-align:center;background:var(--cd);border:3px dashed var(--ac);border-radius:14px;padding:12px;margin:6px 0}
.pic{width:100%;max-width:340px;aspect-ratio:1.4;margin:auto;border-radius:16px;background-size:cover;background-position:center;border:3px solid var(--bd)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px;margin:auto}.ct{aspect-ratio:1;background-size:cover;border-radius:16px;border:4px solid var(--bd);cursor:pointer;display:flex;align-items:flex-end;justify-content:center}.ct b{background:var(--ac);color:#fff;font-size:34px;border-radius:12px;padding:0 18px;margin:8px}.ct.dn{opacity:.6}
.bl{font-size:110px;text-align:center;cursor:pointer;animation:fl 2.4s ease-in-out infinite;line-height:1.3}.bl.dn{animation:none}@keyframes fl{50%{transform:translateY(-14px)}}
.wh{position:relative;width:320px;height:350px;margin:auto}.pt{position:absolute;top:-4px;left:50%;margin-left:-14px;font-size:32px;color:var(--ac);z-index:2;font-style:normal}.wd{position:absolute;top:26px;width:320px;height:320px;border-radius:50%;border:6px solid var(--tx)}.wd span{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:#fff;text-shadow:0 0 3px #000}
.big{text-align:center;font-size:34px;font-weight:bold;margin:30px 0;line-height:1.7}.sb{display:flex;gap:10px;justify-content:center;font-size:26px}.sb span{padding:8px 20px;border-radius:14px;background:var(--cd);border:3px solid var(--bd)}.sb span.on{border-color:var(--ac);background:var(--ac);color:#fff}
.sec{position:relative;width:300px;aspect-ratio:1;margin:8px auto;background-size:cover;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);border-radius:12px;overflow:hidden}.sec i{background:var(--ac);border:2px solid #fff;transition:opacity .6s}.sec i.x{opacity:0}
</style></head><body><div id="app"></div><div class=ft>الأخصائية النفسية: أسماء الهاشمي<br>مديرة المدرسة: شيخة المطاعني</div><script>

wheel(e){let r=Array(6).fill(null),rot=0,busy=0;const col=['#e63946','#f4a261','#f9c74f','#90be6d','#4cc9f0','#9b5de5'];

teams(e){let s=[0,0],n=0,tm=0;const nx=()=>{if(n==6){e.innerHTML=`<div class=big>${s[0]==s[1]?'تعادل 🤝':s[0]>s[1]?'🏆 فريق أ يفوز':'🏆 فريق ب يفوز'}<br>أ: ${s[0]} — ب: ${s[1]}</div>`;return msg('')}

secret(e){let n=0,k=1+Math.floor(Math.random()*6),op=Array(6).fill(0);const nx=()=>{const sc=op.filter(Boolean).length,bd=`<div class=sec style="background-image:url(${P(k)})">${op.map(o=>`<i class="${o?'x':''}"></i>`).join('')}</div>`;

tf2(e){const q=sh([0,1,2,3,4,5]);let n=0,sc=0;const nx=()=>{if(n==6)return fin(e,sc,6);const i=q[n],[Q,a,...w]=QS[i],ok=Math.random()<.5,x=ok?a:sh(w)[0];msg(`السؤال ${n+1} من 6 — النقاط: ${sc}`);

e.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const r=(+b.dataset.v==1)==ok;if(r)sc++;b.classList.add(r?'ok':'no');e.querySelectorAll('.o').forEach(z=>z.onclick=null);msg(r?'✅ أحسنتم':'❌ الإجابة الصحيحة: '+a);n++;setTimeout(nx,2200)})};nx()},
timer(e){let n=0,sc=0;const nx=()=>{if(n==6)return fin(e,sc,12,'<br><small>(نقطتان للإجابة السريعة)</small>');msg(`السؤال ${n+1} من 6 — النقاط: ${sc}`);ask(e,n,(ok,t)=>{if(ok)sc+=t<6?2:1;n++;nx()},12)};nx()},

balloon(e){let r=Array(6).fill(null);const show=()=>{const dn=r.filter(x=>x!==null).length;if(dn==6)return fin(e,r.filter(Boolean).length,6);msg(`افرقعوا بالونة — أجبتم ${dn} من 6`);
